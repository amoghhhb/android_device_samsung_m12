name: Build & Release TWRP Recovery (Samsung Galaxy M12)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build:
    name: Build Verified TWRP Recovery (50-53MB) for SM-M127G
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Device Tree Repository
        uses: actions/checkout@v4

      - name: Free Disk Space & Setup Swap Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 14G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h

      - name: Install Build Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gawk git-core diffstat unzip texinfo gcc-multilib build-essential \
            chrpath socat cpio python3 python3-pip python3-pexpect xz-utils \
            debianutils iputils-ping python3-git python3-jinja2 libegl1-mesa \
            libsdl1.2-dev pylint xterm python3-subunit mesa-common-dev \
            zstd liblz4-tool bison flex gnupg gperf lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev libelf-dev libncurses5-dev \
            libssl-dev libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev openjdk-11-jdk bc
          
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure Git Identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Initialize TWRP Minimal Manifest
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11

      - name: Sync TWRP Source Code
        run: |
          cd ~/twrp
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Setup Device Tree & Genuine Prebuilt Kernel in Build Tree
        run: |
          cd ~/twrp
          mkdir -p device/samsung/m12
          cp -r $GITHUB_WORKSPACE/* device/samsung/m12/
          
          echo "=== Verifying Prebuilt Binaries in Build Tree ==="
          ls -lh device/samsung/m12/prebuilt/
          
          if [ ! -s device/samsung/m12/prebuilt/kernel ]; then
            echo "::error::Prebuilt stock kernel binary is missing or 0 bytes!"
            exit 1
          fi

      - name: Build TWRP Recovery
        run: |
          cd ~/twrp
          source build/envsetup.sh
          lunch omni_m12-userdebug || lunch twrp_m12-userdebug
          mka recoveryimage -j$(nproc --all) || mka bootimage -j$(nproc --all)

      - name: Validate & Prepare Release Artifacts (Min 25MB Check)
        run: |
          cd ~/twrp
          OUT_DIR="out/target/product/m12"
          mkdir -p $GITHUB_WORKSPACE/output
          
          TARGET_IMG=""
          if [ -f "$OUT_DIR/recovery.img" ]; then
            TARGET_IMG="$OUT_DIR/recovery.img"
          elif [ -f "$OUT_DIR/boot.img" ]; then
            TARGET_IMG="$OUT_DIR/boot.img"
          fi

          if [ -z "$TARGET_IMG" ] || [ ! -f "$TARGET_IMG" ]; then
            echo "::error::No recovery.img or boot.img was generated by the build system!"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$TARGET_IMG")
          echo "Generated TWRP image file size: $FILE_SIZE bytes"

          # Strict 25MB safety threshold check
          if [ "$FILE_SIZE" -lt 25000000 ]; then
            echo "::error::CRITICAL ERROR: Generated recovery image size ($FILE_SIZE bytes) is below 25MB threshold!"
            echo "This indicates an incomplete build without kernel or ramdisk integration."
            exit 1
          fi

          cp "$TARGET_IMG" $GITHUB_WORKSPACE/output/twrp-SM-M127G-recovery.img
          cd $GITHUB_WORKSPACE/output
          tar -cf twrp-SM-M127G-recovery.tar twrp-SM-M127G-recovery.img
          cp $GITHUB_WORKSPACE/device_info.json $GITHUB_WORKSPACE/output/device_info.json || true
          
          echo "=== FINAL VERIFIED RELEASE FILES ==="
          ls -lh $GITHUB_WORKSPACE/output/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP_SM-M127G_Full_Build
          path: output/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: twrp-v${{ github.run_number }}
          name: TWRP 3.7.0 Recovery (SM-M127G) Build #${{ github.run_number }}
          body: |
            ## 🟢 Verified TWRP Recovery Build (Samsung Galaxy M12 / SM-M127G)
            
            - **Device**: Samsung Galaxy M12 (`SM-M127G`)
            - **SoC Platform**: Samsung Exynos 850 (`exynos850`)
            - **Kernel**: Genuine Stock Samsung Exynos 850 Kernel (`M127GXXS9DXJ2`)
            - **Verified Image Size**: ~50MB - 53MB (Full Recovery Image)
            
            ### Flash Instructions:
            1. Download `twrp-SM-M127G-recovery.tar`.
            2. Put device in Download Mode (`Vol Down + Vol Up` while connecting USB).
            3. Flash via **Odin** (AP Slot).
          files: output/*
          draft: false
          prerelease: false
